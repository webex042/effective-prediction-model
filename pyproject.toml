[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epm"
version = "0.1.0"
description = "EPM — Efficient Predictive Multimodal Generative Model: A research project investigating efficient generative and multimodal approaches to predictive modeling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EPM Research"},
]
keywords = [
    "machine-learning",
    "deep-learning",
    "multimodal",
    "generative-models",
    "diffusion",
    "flow-matching",
    "model-compression",
    "research",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "isort>=5.12.0"]
ml = ["scikit-learn>=1.3.0", "xgboost>=2.0.0"]
dl = ["torch>=2.0.0", "torchvision>=0.15.0"]
viz = ["streamlit>=1.28.0", "plotly>=5.15.0", "seaborn>=0.12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: end-to-end runs that train models (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
